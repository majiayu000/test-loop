name: self-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax check shell scripts
        run: bash -n bin/check_drift.sh bin/render_report.sh templates/githooks/pre-commit
      - name: check_drift --changed takes changed-only path
        # Regression for LOGIC-01: a dead second argv parser used to reset
        # CHANGED_ONLY=0 after the first parser had already shift'ed argv
        # empty, so --changed always fell through to full mode. With a
        # real source dir + knowledge base and no matching dirty files,
        # changed-only mode must exit 0 with the "no changed … files"
        # message (full mode would error with "no files matched").
        run: |
          set -euo pipefail
          resets=$(grep -cE '^CHANGED_ONLY=0$' bin/check_drift.sh)
          if [ "$resets" -ne 1 ]; then
            echo "error: expected exactly one CHANGED_ONLY=0 assignment (initial default), found $resets" >&2
            grep -nE '^CHANGED_ONLY=0$' bin/check_drift.sh >&2 || true
            exit 1
          fi
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'bin' \
            --knowledge-base templates/knowledge/L1_modules.md \
            --language python)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'no changed python files'
      - name: check_drift --changed pathspecs and staged blobs
        # Codex review follow-ups: relative pathspecs, direct children under
        # the source dir, and index-blob scanning for staged paths.
        run: |
          set -euo pipefail
          mkdir -p Sources/CaffCore/Nested
          printf 'public struct TopLevelProbe {}\n' > Sources/CaffCore/TopLevelProbe.swift
          printf 'public struct NestedProbe {}\n' > Sources/CaffCore/Nested/NestedProbe.swift
          git add Sources/CaffCore/TopLevelProbe.swift Sources/CaffCore/Nested/NestedProbe.swift
          # Drop the worktree copy so only the index blob remains for the
          # top-level file; --changed must still see TopLevelProbe.
          rm Sources/CaffCore/TopLevelProbe.swift
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base templates/knowledge/L1_modules.md \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'TopLevelProbe'
          printf '%s\n' "$out" | grep -q 'NestedProbe'
          # Isolate later steps: do not leave probe blobs staged in the index.
          git reset HEAD -- Sources/CaffCore/TopLevelProbe.swift Sources/CaffCore/Nested/NestedProbe.swift 2>/dev/null || true
          rm -rf Sources/CaffCore
      - name: check_drift --changed root glob, staged L1, and -z paths
        # Codex review follow-ups on beea636: accept absolute --source-glob
        # equal to REPO_ROOT, read L1 from the index blob, and keep unusual
        # filenames via NUL-terminated git path listing.
        run: |
          set -euo pipefail
          REPO=$(pwd)

          # 1) Absolute source-glob equal to REPO_ROOT must not exit 2.
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob "$REPO" \
            --knowledge-base templates/knowledge/L1_modules.md \
            --language python)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qE 'no changed python files|drift:|scanned'

          # 2) Staged undocumented API must fail even if worktree L1 documents it.
          mkdir -p Sources/CaffCore
          kb=templates/knowledge/L1_modules.md
          printf 'public struct StagedOnlyProbe {}\n' > Sources/CaffCore/StagedOnlyProbe.swift
          git add Sources/CaffCore/StagedOnlyProbe.swift
          printf '\nStagedOnlyProbe\n' >> "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'StagedOnlyProbe'
          git checkout -- "$kb"

          # 3) Unusual filename must still be scanned (--changed uses -z).
          printf 'public struct CafeProbe {}\n' > "Sources/CaffCore/café.swift"
          git add "Sources/CaffCore/café.swift"
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base templates/knowledge/L1_modules.md \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'CafeProbe'
          # Isolate later steps: drop staged probes and restore L1 worktree.
          git reset HEAD -- Sources/CaffCore/StagedOnlyProbe.swift "Sources/CaffCore/café.swift" 2>/dev/null || true
          git checkout -- "$kb"
          rm -rf Sources/CaffCore
      - name: check_drift staged-only, worktree L1, deleted index KB, escape
        # Codex review follow-ups on e472247.
        run: |
          set -euo pipefail
          mkdir -p Sources/CaffCore
          kb=templates/knowledge/L1_modules.md

          # 1) --staged ignores an undocumented unstaged sibling file.
          printf 'public struct StagedOk {}\n' > Sources/CaffCore/StagedOk.swift
          printf 'public struct UnstagedBad {}\n' > Sources/CaffCore/UnstagedBad.swift
          git add Sources/CaffCore/StagedOk.swift
          printf '\nStagedOk\n' >> "$kb"
          git add "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          printf '%s\n' "$out" | grep -q 'drift: clean'
          git reset HEAD -- "$kb" Sources/CaffCore/StagedOk.swift
          git checkout -- "$kb"
          rm -f Sources/CaffCore/StagedOk.swift Sources/CaffCore/UnstagedBad.swift

          # 2) Unstaged API + unstaged L1 docs must compare worktree-to-worktree.
          printf 'public struct WorktreePair {}\n' > Sources/CaffCore/WorktreePair.swift
          printf '\nWorktreePair\n' >> "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          printf '%s\n' "$out" | grep -q 'drift: clean'
          git checkout -- "$kb"
          rm -f Sources/CaffCore/WorktreePair.swift

          # 3) Index-deleted KB must not fall back to a worktree recreation.
          printf 'public struct DeletedKbProbe {}\n' > Sources/CaffCore/DeletedKbProbe.swift
          git add Sources/CaffCore/DeletedKbProbe.swift
          git rm --cached -f "$kb"
          printf '\nDeletedKbProbe\n' > "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'DeletedKbProbe'
          git checkout HEAD -- "$kb"
          git reset HEAD -- Sources/CaffCore/DeletedKbProbe.swift 2>/dev/null || true
          rm -f Sources/CaffCore/DeletedKbProbe.swift

          # 4) Relative ../ source-glob escape must exit 2 (not silent clean).
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob '../shared/src' \
            --knowledge-base "$kb" \
            --language python 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 2
          printf '%s\n' "$out" | grep -qi 'inside the repository'
          rm -rf Sources/CaffCore
      - name: check_drift mixed worktree, NUL EXTRACTED, staged without dir
        # Codex review follow-ups on 99b7c23: doubly-changed paths union index
        # and worktree symbols under --changed; EXTRACTED stays NUL-safe for
        # newline paths; --staged does not require the source directory in the
        # worktree.
        run: |
          set -euo pipefail
          mkdir -p Sources/CaffCore
          kb=templates/knowledge/L1_modules.md

          # 1) Staged baseline + unstaged new API on the same path.
          printf 'public struct DoublyBase {}\n' > Sources/CaffCore/Doubly.swift
          printf '\nDoublyBase\n' >> "$kb"
          git add Sources/CaffCore/Doubly.swift "$kb"
          printf 'public struct DoublyBase {}\npublic struct DoublyFresh {}\n' > Sources/CaffCore/Doubly.swift
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'DoublyFresh'
          git reset HEAD -- Sources/CaffCore/Doubly.swift "$kb" 2>/dev/null || true
          git checkout -- "$kb"
          rm -f Sources/CaffCore/Doubly.swift

          # 2) Newline in pathname must not invent phantom missing symbols.
          nl_file=$'Sources/CaffCore/new\nline.swift'
          printf 'public struct NewlineProbe {}\n' > "$nl_file"
          printf '\nNewlineProbe\n' >> "$kb"
          git add -A -- Sources/CaffCore "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          printf '%s\n' "$out" | grep -q 'drift: clean'
          git reset HEAD -- Sources/CaffCore "$kb" 2>/dev/null || true
          git checkout -- "$kb"
          rm -rf Sources/CaffCore

          # 3) --staged still scans when the worktree source dir is gone.
          mkdir -p Sources/CaffCore
          printf 'public struct GoneDirProbe {}\n' > Sources/CaffCore/GoneDirProbe.swift
          git add Sources/CaffCore/GoneDirProbe.swift
          rm -rf Sources/CaffCore
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'GoneDirProbe'
          git reset HEAD -- Sources/CaffCore/GoneDirProbe.swift 2>/dev/null || true
      - name: check_drift portable membership, slashless glob, staged KB, union
        # Codex review follow-ups on 408e254: portable NUL membership (no
        # grep -z), slashless root --source-glob, refuse worktree-only KB in
        # --staged, and union both snapshots for doubly-changed paths.
        run: |
          set -euo pipefail
          kb=templates/knowledge/L1_modules.md

          # 1) Slashless root glob '*.py' must scan repo-root python paths.
          printf 'def RootGlobProbe():\n    pass\n' > RootGlobProbe.py
          git add RootGlobProbe.py
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob '*.py' \
            --knowledge-base "$kb" \
            --language python 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'RootGlobProbe'
          printf '%s\n' "$out" | grep -qv 'under \*\.py'
          git reset HEAD -- RootGlobProbe.py 2>/dev/null || true
          rm -f RootGlobProbe.py

          # 2) --staged must not treat a worktree-only KB as documenting APIs.
          mkdir -p Sources/CaffCore
          printf 'public struct WorktreeKbProbe {}\n' > Sources/CaffCore/WorktreeKbProbe.swift
          git add Sources/CaffCore/WorktreeKbProbe.swift
          WORK_KB=$(mktemp)
          printf '# worktree-only KB\n\nWorktreeKbProbe\n' > "$WORK_KB"
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$WORK_KB" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'WorktreeKbProbe'
          rm -f "$WORK_KB"
          git reset HEAD -- Sources/CaffCore/WorktreeKbProbe.swift 2>/dev/null || true
          rm -rf Sources/CaffCore

          # 3) Doubly-changed path: staged undocumented API + worktree without it.
          mkdir -p Sources/CaffCore
          printf 'public struct UnionBase {}\npublic struct UnionStagedOnly {}\n' > Sources/CaffCore/Union.swift
          git add Sources/CaffCore/Union.swift
          printf 'public struct UnionBase {}\n' > Sources/CaffCore/Union.swift
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'UnionStagedOnly'
          git reset HEAD -- Sources/CaffCore/Union.swift 2>/dev/null || true
          rm -rf Sources/CaffCore

          # 4) Portable membership still sees staged-only index blobs.
          mkdir -p Sources/CaffCore
          printf 'public struct MembershipProbe {}\n' > Sources/CaffCore/MembershipProbe.swift
          git add Sources/CaffCore/MembershipProbe.swift
          rm Sources/CaffCore/MembershipProbe.swift
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'MembershipProbe'
          git reset HEAD -- Sources/CaffCore/MembershipProbe.swift 2>/dev/null || true
          rm -rf Sources/CaffCore
      - name: check_drift dual KB, changed without dir, staged auto lang
        # Codex review follow-ups on 22c0a90: pair each origin with its KB,
        # allow --changed when the worktree source dir is gone, and resolve
        # --staged --language auto from index-only manifests.
        run: |
          set -euo pipefail
          kb=templates/knowledge/L1_modules.md

          # 1) Staged undocumented API + worktree restored + name only in
          #    unstaged KB must still report drift (index symbols vs index KB).
          mkdir -p Sources/CaffCore
          printf 'public struct DualKbBase {}\npublic struct DualKbStaged {}\n' > Sources/CaffCore/DualKb.swift
          git add Sources/CaffCore/DualKb.swift
          printf 'public struct DualKbBase {}\n' > Sources/CaffCore/DualKb.swift
          printf '\nDualKbStaged\n' >> "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'DualKbStaged'
          git checkout -- "$kb"
          git reset HEAD -- Sources/CaffCore/DualKb.swift 2>/dev/null || true
          rm -rf Sources/CaffCore

          # 2) --changed must scan staged blobs when the source dir is gone.
          mkdir -p Sources/CaffCore
          printf 'public struct ChangedGoneDir {}\n' > Sources/CaffCore/ChangedGoneDir.swift
          git add Sources/CaffCore/ChangedGoneDir.swift
          rm -rf Sources/CaffCore
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'ChangedGoneDir'
          git reset HEAD -- Sources/CaffCore/ChangedGoneDir.swift 2>/dev/null || true

          # 3) --staged --language auto must see an index-only pyproject.toml.
          mkdir -p src
          printf '[project]\nname = "tmp"\n' > pyproject.toml
          printf 'def AutoLangProbe():\n    pass\n' > src/a.py
          git add pyproject.toml src/a.py
          rm -f pyproject.toml
          rm -rf src
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'src' \
            --knowledge-base "$kb" \
            --language auto 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'AutoLangProbe'
          git reset HEAD -- pyproject.toml src/a.py 2>/dev/null || true
          rm -f pyproject.toml
          rm -rf src
      - name: check_drift portable sort, staged auto, KB norm, globs, deleted KB
        # Codex review follow-ups: portable NUL uniqueness, dual-snapshot
        # --changed --language auto, normalize KB .. segments, preserve
        # wildcard path components (including dotless filename globs), treat a
        # missing worktree KB as deleted, and dereference staged KB symlinks.
        run: |
          set -euo pipefail
          kb=templates/knowledge/L1_modules.md

          # 1) Portable unique_paths_z still sees staged APIs (empty-list risk).
          mkdir -p Sources/CaffCore
          printf 'public struct PortableSortProbe {}\n' > Sources/CaffCore/PortableSortProbe.swift
          git add Sources/CaffCore/PortableSortProbe.swift
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'PortableSortProbe'
          git reset HEAD -- Sources/CaffCore/PortableSortProbe.swift 2>/dev/null || true
          rm -rf Sources/CaffCore

          # 2) --staged --language auto must ignore worktree-only Package.swift
          #    when pyproject.toml is staged (index-only language resolution).
          mkdir -p src
          printf '[project]\nname = "tmp"\n' > pyproject.toml
          printf 'def StagedAutoIndexOnly():\n    pass\n' > src/a.py
          git add pyproject.toml src/a.py
          printf '// swift package\n' > Package.swift
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'src' \
            --knowledge-base "$kb" \
            --language auto 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'StagedAutoIndexOnly'
          git reset HEAD -- pyproject.toml src/a.py 2>/dev/null || true
          rm -f pyproject.toml Package.swift
          rm -rf src

          # 3) KB path with .. must still resolve the index blob.
          mkdir -p Sources/CaffCore
          printf 'public struct KbDotDotProbe {}\n' > Sources/CaffCore/KbDotDotProbe.swift
          git add Sources/CaffCore/KbDotDotProbe.swift
          # Document in the real KB and stage it so index lookup must succeed
          # through the normalized spelling.
          printf '\nKbDotDotProbe\n' >> "$kb"
          git add "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base 'templates/knowledge/../knowledge/L1_modules.md' \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          printf '%s\n' "$out" | grep -q 'drift: clean'
          git checkout -- "$kb"
          git reset HEAD -- Sources/CaffCore/KbDotDotProbe.swift "$kb" 2>/dev/null || true
          rm -rf Sources/CaffCore

          # 4) Intermediate wildcard in --source-glob must reach git pathspecs.
          mkdir -p packages/a/src
          printf 'def WildcardGlobProbe():\n    pass\n' > packages/a/src/mod.py
          git add packages/a/src/mod.py
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'packages/*/src/**/*.py' \
            --knowledge-base "$kb" \
            --language python 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'WildcardGlobProbe'
          git reset HEAD -- packages/a/src/mod.py 2>/dev/null || true
          rm -rf packages

          # 5) Deleted worktree KB + unstaged source edit must not fall back
          #    to the index KB (would falsely report clean).
          mkdir -p Sources/CaffCore
          printf 'public struct DeletedKbProbe {}\n' > Sources/CaffCore/DeletedKbProbe.swift
          printf '\nDeletedKbProbe\n' >> "$kb"
          git add "$kb"
          rm -f "$kb"
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base "$kb" \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'DeletedKbProbe'
          git checkout -- "$kb"
          git reset HEAD -- "$kb" 2>/dev/null || true
          rm -rf Sources/CaffCore

          # 6) Filename-specific --source-glob must not become dir/*.ext.
          mkdir -p src
          printf 'def FileGlobProbe():\n    pass\n' > src/api.py
          git add src/api.py
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'src/api.py' \
            --knowledge-base "$kb" \
            --language python 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'FileGlobProbe'
          printf 'def FileGlobStarProbe():\n    pass\n' > src/test_x.py
          git add src/test_x.py
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'src/test_*.py' \
            --knowledge-base "$kb" \
            --language python 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'FileGlobStarProbe'
          git reset HEAD -- src/api.py src/test_x.py 2>/dev/null || true
          rm -rf src

          # 7) --changed --language auto must consult index-only manifests.
          mkdir -p src
          printf 'def ChangedAutoProbe():\n    pass\n' > src/a.py
          printf '[project]\nname = "probe"\n' > pyproject.toml
          git add src/a.py pyproject.toml
          rm -f pyproject.toml
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'src' \
            --knowledge-base "$kb" \
            --language auto 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'ChangedAutoProbe'
          git reset HEAD -- src/a.py pyproject.toml 2>/dev/null || true
          rm -rf src
          rm -f pyproject.toml

          # 8) --changed --language auto must not let a worktree-only higher
          #    priority manifest (Package.swift) mask staged Python sources.
          mkdir -p src
          printf '[project]\nname = "probe"\n' > pyproject.toml
          printf 'def ChangedAutoDualProbe():\n    pass\n' > src/a.py
          git add pyproject.toml src/a.py
          printf '// swift package\n' > Package.swift
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'src' \
            --knowledge-base "$kb" \
            --language auto 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'ChangedAutoDualProbe'
          git reset HEAD -- pyproject.toml src/a.py 2>/dev/null || true
          rm -f pyproject.toml Package.swift
          rm -rf src

          # 9) Dotless filename wildcards (src/**/test_*) must stay file
          #    pathspecs, not become dir/*.ext.
          mkdir -p src/unit
          printf 'def DotlessGlobProbe():\n    pass\n' > src/unit/test_api.py
          git add src/unit/test_api.py
          set +e
          out=$(bin/check_drift.sh \
            --changed \
            --source-glob 'src/**/test_*' \
            --knowledge-base "$kb" \
            --language python 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'DotlessGlobProbe'
          git reset HEAD -- src/unit/test_api.py 2>/dev/null || true
          rm -rf src

          # 10) Staged knowledge-base symlink must be dereferenced to the
          #     target Markdown blob (not the symlink pathname).
          mkdir -p Sources/CaffCore docs/knowledge
          printf 'public struct SymlinkKbProbe {}\n' > Sources/CaffCore/SymlinkKbProbe.swift
          printf 'SymlinkKbProbe\n' > docs/knowledge/L1_symlink_target.md
          ln -sf L1_symlink_target.md docs/knowledge/L1_symlink.md
          git add Sources/CaffCore/SymlinkKbProbe.swift \
            docs/knowledge/L1_symlink_target.md docs/knowledge/L1_symlink.md
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base 'docs/knowledge/L1_symlink.md' \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          printf '%s\n' "$out" | grep -q 'drift: clean'
          git reset HEAD -- Sources/CaffCore/SymlinkKbProbe.swift \
            docs/knowledge/L1_symlink_target.md docs/knowledge/L1_symlink.md \
            2>/dev/null || true
          rm -rf Sources/CaffCore docs/knowledge/L1_symlink_target.md \
            docs/knowledge/L1_symlink.md

          # 11) Slashless filename pathspec 'test_*' must not broaden to
          #     repository-wide *.$ext/**/*.$ext (unrelated files stay unscanned).
          printf 'def SlashlessGlobProbe():\n    pass\n' > test_slashless.py
          printf 'def UnrelatedSlashless():\n    pass\n' > unrelated.py
          git add test_slashless.py unrelated.py
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'test_*' \
            --knowledge-base "$kb" \
            --language python 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 1
          printf '%s\n' "$out" | grep -q 'SlashlessGlobProbe'
          printf '%s\n' "$out" | grep -qv 'UnrelatedSlashless'
          git reset HEAD -- test_slashless.py unrelated.py 2>/dev/null || true
          rm -f test_slashless.py unrelated.py

          # 12) Chained staged KB symlinks (kb -> middle -> target) must resolve
          #     to the final Markdown document before tokenizing.
          mkdir -p Sources/CaffCore docs/knowledge
          printf 'public struct ChainKbProbe {}\n' > Sources/CaffCore/ChainKbProbe.swift
          printf 'ChainKbProbe\n' > docs/knowledge/L1_chain_target.md
          ln -sf L1_chain_target.md docs/knowledge/L1_chain_middle.md
          ln -sf L1_chain_middle.md docs/knowledge/L1_chain.md
          git add Sources/CaffCore/ChainKbProbe.swift \
            docs/knowledge/L1_chain_target.md docs/knowledge/L1_chain_middle.md \
            docs/knowledge/L1_chain.md
          set +e
          out=$(bin/check_drift.sh \
            --staged \
            --source-glob 'Sources/CaffCore' \
            --knowledge-base 'docs/knowledge/L1_chain.md' \
            --language swift 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          test "$rc" -eq 0
          printf '%s\n' "$out" | grep -q 'drift: clean'
          git reset HEAD -- Sources/CaffCore/ChainKbProbe.swift \
            docs/knowledge/L1_chain_target.md docs/knowledge/L1_chain_middle.md \
            docs/knowledge/L1_chain.md 2>/dev/null || true
          rm -rf Sources/CaffCore docs/knowledge/L1_chain_target.md \
            docs/knowledge/L1_chain_middle.md docs/knowledge/L1_chain.md
      - name: pytest report counts and failing names
        run: |
          python3 - <<'PY'
          import json
          import re
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          failure = "FAILED test_example.py::{} - AssertionError\n"
          names = ["test_rejects_invalid_input", "test_happy_path_asserts", "test_with_invalid_email"]
          cases = [
              ("issue-8", "".join(failure.format(name) for name in [*names[:2], names[0], names[2]])
               + "========================= 1 passed, 3 failed in 0.05s ==========================\n",
               (4, 1, 3), ["test_example.py::" + name for name in names]),
              ("passing", "3 passed in 0.01s\n", (3, 3, 0), []),
              ("failing", failure.format("test_z") + failure.format("test_a")
               + "2 failed in 0.01s\n", (2, 0, 2), ["test_example.py::test_z", "test_example.py::test_a"]),
              ("failed-first", failure.format("test_z") + "1 failed, 2 passed in 0.01s\n",
               (3, 2, 1), ["test_example.py::test_z"]),
              ("explicit-passed", "PASSED test_example.py::test_ok\n" + failure.format("test_z") * 2
               + "1 failed, 1 passed in 0.01s\n", (2, 1, 1), ["test_example.py::test_z"]),
              ("no-summary", "PASSED test_example.py::test_ok\n" + failure.format("test_z"),
               (2, 1, 1), ["test_example.py::test_z"]),
              ("test-ids", failure.format("TestExample::test_value[a]") * 2
               + failure.format("TestExample::test_value[b]") + "2 failed in 0.01s\n",
               (2, 0, 2), ["test_example.py::TestExample::test_value[a]", "test_example.py::TestExample::test_value[b]"]),
              ("multiple-runs", "8 passed in 0.01s\n" + failure.format("test_z")
               + "1 failed, 2 passed in 0.02s\n", (11, 10, 1), ["test_example.py::test_z"]),
              ("parameter-delimiter", "FAILED test_params.py::test_value[a - b] - assert data == ['a - b']\n" * 2
               + "FAILED test_params.py::test_value[a - c] - assert False\n2 failed in 0.01s\n",
               (2, 0, 2), ["test_params.py::test_value[a - b]", "test_params.py::test_value[a - c]"]),
              ("same-name-modules", "FAILED tests/a/test_api.py::test_shared - AssertionError\n"
               + "FAILED tests/b/test_api.py::test_shared - AssertionError\n2 failed in 0.01s\n",
               (2, 0, 2), ["tests/a/test_api.py::test_shared", "tests/b/test_api.py::test_shared"]),
              ("failure-then-pass", failure.format("test_z") + "1 failed in 0.01s\n2 passed in 0.02s\n",
               (3, 2, 1), ["test_example.py::test_z"]),
              ("path-delimiter", "FAILED tests/a - b/test_params.py::test_value - assert False\n"
               + "FAILED tests/a - c/test_params.py::test_value - assert False\n2 failed in 0.01s\n",
               (2, 0, 2), ["tests/a - b/test_params.py::test_value", "tests/a - c/test_params.py::test_value"]),
              ("closing-bracket-id", "FAILED test_params.py::test_value[a] - b] - assert False\n" * 2
               + "FAILED test_params.py::test_value[a] - c] - assert False\n2 failed in 0.01s\n",
               (2, 0, 2), ["test_params.py::test_value[a] - b]", "test_params.py::test_value[a] - c]"]),
              ("incomplete-then-pass", "FAILED first/test_api.py::test_z - AssertionError\n2 passed in 0.02s\n",
               (3, 2, 1), ["first/test_api.py::test_z"]),
              ("pass-then-incomplete", "2 passed in 0.02s\n" + failure.format("test_z") * 2,
               (3, 2, 1), ["test_example.py::test_z"]),
              ("session-boundary", "FAILED first/test_api.py::test_z - AssertionError\n"
               + "=================== test session starts ===================\n"
               + failure.format("test_z") + "1 failed, 2 passed in 0.02s\n",
               (4, 2, 2), ["first/test_api.py::test_z", "test_example.py::test_z"]),
              ("incomplete-then-failing-quiet", failure.format("test_z")
               + "F [100%]\n=================== FAILURES ===================\n"
               + "=================== short test summary info ===================\n"
               + failure.format("test_z") + "1 failed in 0.02s\n",
               (2, 0, 2), ["test_example.py::test_z"]),
              ("uncaptured-stdout", "=================== test session starts ===================\n"
               + "test_example.py \n10 passed in 0.50s\n.\n\n"
               + "=================== 1 passed in 0.01s ===================\n", (1, 1, 0), []),
              ("uncaptured-stdout-quiet", "\n10 passed in 0.50s\n.\n1 passed in 0.01s\n", (1, 1, 0), []),
              ("assertion-delimiter", "FAILED test_ids.py::test_value[a] - b] - AssertionError: whoops] - tail\n"
               + "FAILED test_ids.py::test_value[a] - b] - AssertionError: other] - tail\n"
               + "1 failed in 0.01s\n", (1, 0, 1), ["test_ids.py::test_value[a] - b]"]),
              ("raw-bytes", b"\xff\n.\n1 passed in 0.01s\n", (1, 1, 0), []),
              ("captured-stdout", "F [100%]\n=================== FAILURES ===================\n"
               + "___________________ test_value ___________________\n"
               + "------------------- Captured stdout call -------------------\n10 passed in 0.50s\n"
               + "=================== short test summary info ===================\n"
               + failure.format("test_value") + "1 failed in 0.01s\n",
               (1, 0, 1), ["test_example.py::test_value"]),
          ]
          source = Path.cwd()
          day = subprocess.check_output(["date", "+%Y-%m-%d"], text=True).strip()
          for label, log, counts, expected_names in cases:
              log_bytes = log.encode() if isinstance(log, str) else log
              for mode in ("collect", "live"):
                  with tempfile.TemporaryDirectory(prefix="pytest-report-") as temp:
                      repo = Path(temp)
                      shutil.copytree(source / "bin", repo / "bin")
                      report_dir = repo / "docs/reports" / day
                      report_dir.mkdir(parents=True)
                      if mode == "collect":
                          (report_dir / "log.txt").write_bytes(log_bytes)
                          args = ["--collect"]
                      else:
                          (repo / "input.log").write_bytes(log_bytes)
                          args = ["--test-command", "cat input.log; exit 3"]
                      result = subprocess.run(
                          ["bash", str(repo / "bin/render_report.sh"), "--language", "python", *args],
                          capture_output=True,
                      )
                      summary = json.loads((report_dir / "summary.json").read_text())
                      report = (report_dir / "report.md").read_text()
                      actual = tuple(summary[key] for key in ("total", "passed", "failed"))
                      assert actual == counts, (label, mode, actual, counts)
                      assert f"**Counts:** total={counts[0]} passed={counts[1]} failed={counts[2]}" in report
                      assert re.findall(r"^- `([^`]+)`$", report, re.MULTILINE) == expected_names, (label, mode, report)
                      classified = json.loads((report_dir / "classify.json").read_text())
                      assert classified["failures"] == expected_names, (label, mode, classified)
                      grouped = summary["failures_grouped"]
                      assert sorted(name for group in grouped.values() for name in group) == sorted(expected_names)
                      assert sum(summary["failures_by_class"].values()) == len(expected_names)
                      assert summary["exit_code"] == result.returncode, (label, mode, result.stderr)
                      if label == "multiple-runs":
                          assert summary["run_line"] == "8 passed in 0.01s; 1 failed, 2 passed in 0.02s"
                      if label == "failure-then-pass":
                          assert summary["run_line"] == "1 failed in 0.01s; 2 passed in 0.02s"
                      if mode == "live":
                          assert result.returncode == 3, (label, result.stderr)
                      assert (report_dir / "log.txt").read_bytes() == log_bytes
                      print(f"PASS: {label} ({mode})")
          PY
      - name: pytest output and classifier failure boundaries
        run: |
          python3 -m pip install pytest
          python3 - <<'PY'
          import json
          import os
          import re
          import shlex
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          source = Path.cwd()
          day = subprocess.check_output(["date", "+%Y-%m-%d"], text=True).strip()
          cases = [
              ("stdout", "def test_output():\n    print('\\n10 passed in 0.50s')\n", "-s", (1, 1, 0), []),
              ("stdout-quiet", "def test_output():\n    print('\\n10 passed in 0.50s')\n", "-q -s", (1, 1, 0), []),
              ("decorated-stdout", "def test_output():\n    print('\\n================ 10 passed in 0.50s ================')\n",
               "-s", (1, 1, 0), []),
              ("decorated-stdout-quiet", "def test_output():\n    print('\\n================ 10 passed in 0.50s ================')\n",
               "-q -s", (1, 1, 0), []),
              ("decorated-captured", "def test_output():\n    print('================ 10 passed in 0.50s ================')\n"
               + "    assert False\n", "-q", (1, 0, 1), ["test_boundary.py::test_output"]),
              ("warnings", "import warnings\ndef test_output():\n    warnings.warn('one warning')\n", "-q", (1, 1, 0), []),
              ("warnings-stdout", "import warnings\ndef test_output():\n    print('\\n10 passed in 0.50s')\n"
               + "    warnings.warn('one warning')\n", "-q -s", (1, 1, 0), []),
              ('teardown', "import pytest\n@pytest.fixture\ndef resource():\n    yield\n    print('\\n10 passed in 0.50s')\ndef test_output(resource):\n    pass\n", '-s', (1, 1, 0), []),
              ('teardown-quiet', "import pytest\n@pytest.fixture\ndef resource():\n    yield\n    print('\\n10 passed in 0.50s')\ndef test_output(resource):\n    pass\n", '-q -s', (1, 1, 0), []),
              ('teardown-cleanup', "import pytest\n@pytest.fixture\ndef resource():\n    yield\n    print('\\n10 passed in 0.50s')\ndef test_output(resource):\n    pass\n", '-q -s', (1, 1, 0), []),
              ('teardown-decorated', "import pytest\n@pytest.fixture\ndef resource():\n    yield\n    print('\\n================ 10 passed in 0.50s ================')\ndef test_output(resource):\n    pass\n", '-q -s', (1, 1, 0), []),
              ('teardown-blank', "import pytest\n@pytest.fixture\ndef resource():\n    yield\n    print('\\n\\n10 passed in 0.50s')\ndef test_output(resource):\n    pass\n", '-q -s', (1, 1, 0), []),
              ("bytes", "import os\ndef test_output():\n    os.write(1, b'\\xff\\n')\n", "-q -s", (1, 1, 0), []),
              ("ids", "import pytest\n@pytest.mark.parametrize('x', [1, 2], ids=['a] - b', 'a] - c'])\n"
               + "def test_output(x):\n    raise AssertionError('whoops] - tail')\n", "-q", (2, 0, 2),
               ["test_boundary.py::test_output[a] - b]", "test_boundary.py::test_output[a] - c]"]),
          ]
          for label, test_source, flags, counts, names in cases:
              with tempfile.TemporaryDirectory() as temp:
                  repo = Path(temp)
                  shutil.copytree(source / "bin", repo / "bin")
                  (repo / "test_boundary.py").write_text(test_source)
                  command = shlex.quote(sys.executable) + " -m pytest --color=no " + flags
                  command += " test_boundary.py"
                  if label.startswith("warnings") or label == "teardown-cleanup":
                      command += "; echo cleanup"
                  run = subprocess.run(["bash", "bin/render_report.sh", "--language", "python", "--test-command", command],
                                       cwd=repo, capture_output=True, env=os.environ | {"CI": "true"})
                  artifacts = repo / "docs/reports" / day
                  raw = (artifacts / "log.txt").read_bytes()
                  assert raw == run.stdout
                  assert run.returncode == (1 if names else 0), (label, run.stderr)
                  if label == "bytes":
                      assert b"\xff" in raw
                  for mode in ("live", "collect"):
                      if mode == "collect":
                          run = subprocess.run(["bash", "bin/render_report.sh", "--language", "python", "--collect"],
                                               cwd=repo, capture_output=True)
                      summary = json.loads((artifacts / "summary.json").read_text())
                      report = (artifacts / "report.md").read_text()
                      classified = json.loads((artifacts / "classify.json").read_text())
                      assert tuple(summary[k] for k in ("total", "passed", "failed")) == counts, (label, mode, summary)
                      if label.startswith("teardown"):
                          assert "10 passed" not in summary["run_line"], (label, mode, summary)
                      if label == "teardown-cleanup":
                          assert raw.endswith(b"cleanup\n")
                      if label.startswith("warnings"):
                          assert re.match(r"^1 passed, 1 warning in ", summary["run_line"]), (label, mode, summary)
                          assert raw.endswith(b"cleanup\n")
                      assert re.findall(r"^- `([^`]+)`$", report, re.MULTILINE) == names
                      assert classified["failures"] == names and not summary.get("classify_error")
                      assert summary["exit_code"] == run.returncode
                      assert (artifacts / "log.txt").read_bytes() == raw
                      print(f"PASS: actual pytest {label} ({mode})")
          for breakage in ("missing", "syntax", "import"):
              for failed in (False, True):
                  for mode in ("collect", "live"):
                      with tempfile.TemporaryDirectory() as temp:
                          repo = Path(temp)
                          shutil.copytree(source / "bin", repo / "bin")
                          classifier = repo / "bin/classify_failures.py"
                          if breakage == "missing":
                              classifier.unlink()
                          elif breakage == "syntax":
                              classifier.write_text("invalid syntax !\n")
                          else:
                              classifier.write_text("raise RuntimeError('import failure')\n")
                          log = b"FAILED test_a.py::test_fail - AssertionError\n1 failed in 0.01s\n" if failed else b"1 passed in 0.01s\n"
                          artifacts = repo / "docs/reports" / day
                          artifacts.mkdir(parents=True)
                          if mode == "collect":
                              (artifacts / "log.txt").write_bytes(log)
                              args = ["--collect"]
                          else:
                              (repo / "input.log").write_bytes(log)
                              args = ["--test-command", "cat input.log; exit 3"]
                          run = subprocess.run(["bash", "bin/render_report.sh", "--language", "python", *args],
                                               cwd=repo, capture_output=True)
                          summary = json.loads((artifacts / "summary.json").read_text())
                          assert summary["classify_error"] and summary["exit_code"] == run.returncode
                          assert tuple(summary[k] for k in ("total", "passed", "failed")) == (1, int(not failed), int(failed))
                          assert (artifacts / "report.md").exists() and (artifacts / "classify.err").stat().st_size
                          assert b"classify_failures.py failed" in run.stderr
                          assert (artifacts / "log.txt").read_bytes() == log
                          if mode == "live":
                              assert run.returncode == 3
                          print(f"PASS: degraded {breakage} failed={failed} ({mode})")
              for mode in ("collect", "live"):
                  with tempfile.TemporaryDirectory() as temp:
                      repo = Path(temp)
                      shutil.copytree(source / "bin", repo / "bin")
                      classifier = repo / "bin/classify_failures.py"
                      if breakage == "missing":
                          classifier.unlink()
                      elif breakage == "syntax":
                          classifier.write_text("invalid syntax !\n")
                      else:
                          classifier.write_text("raise RuntimeError('import failure')\n")
                      node = "tests/a - b/test_a.py::test_value[a] - b]"
                      log = ("___________________ test_value[a] - b] ___________________\n"
                             + "FAILED " + node + " - AssertionError: whoops] - tail\n"
                             + "FAILED " + node + " - AssertionError: other] - tail\n"
                             + "1 failed in 0.01s\n").encode()
                      artifacts = repo / "docs/reports" / day
                      artifacts.mkdir(parents=True)
                      if mode == "collect":
                          (artifacts / "log.txt").write_bytes(log)
                          args = ["--collect"]
                      else:
                          (repo / "input.log").write_bytes(log)
                          args = ["--test-command", "cat input.log; exit 3"]
                      run = subprocess.run(["bash", "bin/render_report.sh", "--language", "python", *args],
                                           cwd=repo, capture_output=True)
                      summary = json.loads((artifacts / "summary.json").read_text())
                      report = (artifacts / "report.md").read_text()
                      assert summary["classify_error"] and summary["exit_code"] == run.returncode
                      assert tuple(summary[k] for k in ("total", "passed", "failed")) == (1, 0, 1)
                      assert re.findall(r"^- `([^`]+)`$", report, re.MULTILINE) == [node]
                      assert (artifacts / "classify.err").stat().st_size and b"classify_failures.py failed" in run.stderr
                      assert (artifacts / "log.txt").read_bytes() == log
                      if mode == "live":
                          assert run.returncode == 3
                      print(f"PASS: degraded duplicate {breakage} ({mode})")
          PY
      - name: Failure classifier self-test
        run: python3 bin/classify_failures.py --self-test
