name: self-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax check shell scripts
        run: bash -n bin/check_drift.sh bin/render_report.sh templates/githooks/pre-commit
      - name: Failure classifier self-test
        run: python3 bin/classify_failures.py --self-test
      - name: check_drift documented invocation smoke
        run: |
          set -euo pipefail
          FIXTURE="$(mktemp -d)"
          trap 'rm -rf "$FIXTURE"' EXIT
          mkdir -p "$FIXTURE/src/pkg" "$FIXTURE/src/other" "$FIXTURE/src/mid/pkg" "$FIXTURE/docs/knowledge"
          cat > "$FIXTURE/src/pkg/mod.py" <<'PY'
          class DocumentedSymbol:
              pass

          class MissingSymbol:
              pass
          PY
          cat > "$FIXTURE/src/other/skip_me.py" <<'PY'
          class ShouldNotScan:
              pass
          PY
          cat > "$FIXTURE/src/mid/pkg/keep.py" <<'PY'
          class MidPkgSymbol:
              pass
          PY
          # Directory knowledge-base + ** glob: clean when symbols are named.
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          DocumentedSymbol MissingSymbol MidPkgSymbol ShouldNotScan
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
          # Same fixture, omit one symbol → expect drift (exit 1).
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          DocumentedSymbol MidPkgSymbol ShouldNotScan
          MD
          set +e
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
          drift_status=$?
          set -e
          if [ "$drift_status" -ne 1 ]; then
            echo "expected drift exit 1 when MissingSymbol is omitted, got $drift_status" >&2
            exit 1
          fi
          # File-mode knowledge-base still works.
          cat > "$FIXTURE/docs/knowledge/L1_modules.md" <<'MD'
          # L1
          DocumentedSymbol MissingSymbol MidPkgSymbol ShouldNotScan
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge/L1_modules.md"
          # Non-recursive single-segment glob (no GNU -maxdepth).
          mkdir -p "$FIXTURE/top"
          cat > "$FIXTURE/top/only.py" <<'PY'
          class TopOnly:
              pass
          PY
          mkdir -p "$FIXTURE/top/nested"
          cat > "$FIXTURE/top/nested/deep.py" <<'PY'
          class NestedDeep:
              pass
          PY
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          TopOnly
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/top/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
          # Intermediate wildcard segments must not widen to every *.py under src.
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          MidPkgSymbol
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/*/pkg/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
          # Unreadable subtree under a ** glob must fail closed (not report clean).
          mkdir -p "$FIXTURE/src/locked"
          cat > "$FIXTURE/src/locked/hidden_sym.py" <<'PY'
          class LockedMissing:
              pass
          PY
          chmod 000 "$FIXTURE/src/locked"
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          DocumentedSymbol MissingSymbol MidPkgSymbol ShouldNotScan
          MD
          if bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"; then
            chmod 755 "$FIXTURE/src/locked" || true
            echo "expected expansion failure on unreadable subtree" >&2
            exit 1
          fi
          # Trailing ** (no filename segment) must also fail closed.
          if bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**" \
            --knowledge-base "$FIXTURE/docs/knowledge"; then
            chmod 755 "$FIXTURE/src/locked" || true
            echo "expected expansion failure on trailing ** unreadable subtree" >&2
            exit 1
          fi
          chmod 755 "$FIXTURE/src/locked"
          rm -rf "$FIXTURE/src/locked"
          # Unreadable dirs under implicit leading-dot trees must not fail:
          # glob.glob skips those components unless the pattern names them.
          mkdir -p "$FIXTURE/src/.hidden/locked"
          cat > "$FIXTURE/src/.hidden/locked/x.py" <<'PY'
          class HiddenLocked:
              pass
          PY
          chmod 000 "$FIXTURE/src/.hidden/locked"
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
          chmod 755 "$FIXTURE/src/.hidden/locked" || true
          rm -rf "$FIXTURE/src/.hidden"
          # Explicit leading-dot segment before ** must still probe that tree.
          mkdir -p "$FIXTURE/src/.generated/locked"
          cat > "$FIXTURE/src/.generated/ok.py" <<'PY'
          class GeneratedOk:
              pass
          PY
          cat > "$FIXTURE/src/.generated/locked/miss.py" <<'PY'
          class GeneratedLocked:
              pass
          PY
          echo "GeneratedOk" >> "$FIXTURE/docs/knowledge/api.md"
          chmod 000 "$FIXTURE/src/.generated/locked"
          if bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/.generated/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"; then
            chmod 755 "$FIXTURE/src/.generated/locked" || true
            echo "expected fail-closed on explicit .generated/** unreadable subtree" >&2
            exit 1
          fi
          chmod 755 "$FIXTURE/src/.generated/locked" || true
          rm -rf "$FIXTURE/src/.generated"
          # --changed must ignore hidden paths that full-mode glob excludes.
          # Fixture must live inside this git work tree so ls-files can see it.
          HFIX="$(mktemp -d "$PWD/ci-drift-XXXXXX")"
          mkdir -p "$HFIX/src/.nest" "$HFIX/docs"
          cat > "$HFIX/docs/api.md" <<'MD'
          # API
          MD
          cat > "$HFIX/src/.dot.py" <<'PY'
          class DotFileSymbol:
              pass
          PY
          cat > "$HFIX/src/.nest/x.py" <<'PY'
          class NestHiddenSymbol:
              pass
          PY
          REL_HFIX="${HFIX#$PWD/}"
          OUT="$(bin/check_drift.sh \
            --language python \
            --changed \
            --source-glob "$REL_HFIX/src/**/*.py" \
            --knowledge-base "$REL_HFIX/docs/api.md")"
          echo "$OUT" | grep -q 'nothing to check'
          # Explicit leading-dot segment in the glob must still be scanned.
          mkdir -p "$HFIX/src/.generated"
          cat > "$HFIX/src/.generated/g.py" <<'PY'
          class GeneratedSymbol:
              pass
          PY
          if bin/check_drift.sh \
            --language python \
            --changed \
            --source-glob "$REL_HFIX/src/.generated/*.py" \
            --knowledge-base "$REL_HFIX/docs/api.md"; then
            rm -rf "$HFIX"
            echo "expected drift for explicitly named .generated path" >&2
            exit 1
          fi
          # './' prefix must normalize for --changed pathspecs.
          mkdir -p "$HFIX/src/norm"
          cat > "$HFIX/src/norm/n.py" <<'PY'
          class NormSymbol:
              pass
          PY
          echo "NormSymbol" >> "$HFIX/docs/api.md"
          bin/check_drift.sh \
            --language python \
            --changed \
            --source-glob "./$REL_HFIX/src/norm/*.py" \
            --knowledge-base "$REL_HFIX/docs/api.md"
          # Bracket expressions must expand (not treat [ab] as a literal dir).
          mkdir -p "$HFIX/src/a" "$HFIX/src/b"
          cat > "$HFIX/src/a/bracket.py" <<'PY'
          class BracketA:
              pass
          PY
          echo "BracketA" >> "$HFIX/docs/api.md"
          bin/check_drift.sh \
            --language python \
            --source-glob "$HFIX/src/[ab]/*.py" \
            --knowledge-base "$HFIX/docs/api.md"
          # Wildcard expansion must honor LANG_EXT (ignore .txt templates).
          cat > "$HFIX/src/norm/template.txt" <<'TXT'
          class NotPython:
              pass
          TXT
          bin/check_drift.sh \
            --language python \
            --source-glob "$HFIX/src/norm/**/*" \
            --knowledge-base "$HFIX/docs/api.md"
          # Knowledge-base directory symlink must be traversed (-H).
          ln -s "$HFIX/docs" "$HFIX/docs-link"
          bin/check_drift.sh \
            --language python \
            --source-glob "$HFIX/src/norm/*.py" \
            --knowledge-base "$HFIX/docs-link"
          # Symlinked source dir under ** must be probed (followlinks).
          mkdir -p "$HFIX/outside/locked"
          cat > "$HFIX/outside/locked/via_link.py" <<'PY'
          class ViaLinkMissing:
              pass
          PY
          chmod 000 "$HFIX/outside/locked"
          ln -s "$HFIX/outside/locked" "$HFIX/src/norm/via_link"
          if bin/check_drift.sh \
            --language python \
            --source-glob "$HFIX/src/norm/**/*.py" \
            --knowledge-base "$HFIX/docs/api.md"; then
            chmod 755 "$HFIX/outside/locked" || true
            rm -rf "$HFIX"
            echo "expected fail-closed on unreadable symlink target" >&2
            exit 1
          fi
          chmod 755 "$HFIX/outside/locked" || true
          rm -rf "$HFIX"
      - name: Skill copies are synchronized
        run: python3 scripts/sync_skills.py --check
