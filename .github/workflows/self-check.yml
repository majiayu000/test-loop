name: self-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax check shell scripts
        run: bash -n bin/check_drift.sh bin/render_report.sh templates/githooks/pre-commit
      - name: Failure classifier self-test
        run: python3 bin/classify_failures.py --self-test
      - name: check_drift documented invocation smoke
        run: |
          set -euo pipefail
          FIXTURE="$(mktemp -d)"
          trap 'rm -rf "$FIXTURE"' EXIT
          mkdir -p "$FIXTURE/src/pkg" "$FIXTURE/src/other" "$FIXTURE/src/mid/pkg" "$FIXTURE/docs/knowledge"
          cat > "$FIXTURE/src/pkg/mod.py" <<'PY'
          class DocumentedSymbol:
              pass

          class MissingSymbol:
              pass
          PY
          cat > "$FIXTURE/src/other/skip_me.py" <<'PY'
          class ShouldNotScan:
              pass
          PY
          cat > "$FIXTURE/src/mid/pkg/keep.py" <<'PY'
          class MidPkgSymbol:
              pass
          PY
          # Directory knowledge-base + ** glob: clean when symbols are named.
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          DocumentedSymbol MissingSymbol MidPkgSymbol ShouldNotScan
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
          # Same fixture, omit one symbol → expect drift (exit 1).
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          DocumentedSymbol MidPkgSymbol ShouldNotScan
          MD
          if bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"; then
            echo "expected drift exit 1 when MissingSymbol is omitted" >&2
            exit 1
          fi
          # File-mode knowledge-base still works.
          cat > "$FIXTURE/docs/knowledge/L1_modules.md" <<'MD'
          # L1
          DocumentedSymbol MissingSymbol MidPkgSymbol ShouldNotScan
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/**/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge/L1_modules.md"
          # Non-recursive single-segment glob (no GNU -maxdepth).
          mkdir -p "$FIXTURE/top"
          cat > "$FIXTURE/top/only.py" <<'PY'
          class TopOnly:
              pass
          PY
          mkdir -p "$FIXTURE/top/nested"
          cat > "$FIXTURE/top/nested/deep.py" <<'PY'
          class NestedDeep:
              pass
          PY
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          TopOnly
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/top/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
          # Intermediate wildcard segments must not widen to every *.py under src.
          cat > "$FIXTURE/docs/knowledge/api.md" <<'MD'
          # API
          MidPkgSymbol
          MD
          bin/check_drift.sh \
            --language python \
            --source-glob "$FIXTURE/src/*/pkg/*.py" \
            --knowledge-base "$FIXTURE/docs/knowledge"
      - name: Skill copies are synchronized
        run: python3 scripts/sync_skills.py --check
